name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # No third-party dependencies: the project is pure standard library.
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the CLI on a fixture
        run: python -m buildfail_triage fixtures/test_failure.log --format json
